# ============================================================
# PORTFOLIO CONFIGURATION
# This file is in the YAML format and is very sensitive to 
# spaces. Ensure to match the indentation level and spacing
# of new items with existing ones

# Edit all lines marked [YOUR ...] to customize your site
# ============================================================

site_name: "Sardar Balbeer Singh - Portfolio"
site_description: "Portfolio of Sardar Balbeer Singh — GIS, Remote Sensing, Spatial Data Science, and Data Engineering"
site_author: "Sardar Balbeer Singh"
# After your site is live, uncomment and set this to your actual GitHub Pages URL:
# site_url: "https://balbeer.github.io"

theme:
  name: material
  # Icon used as both the site logo (header) and browser favicon.
  # Browse icons at https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  icon:
    logo: material/earth
  palette:
    # To change the color, edit the 'primary' and 'accent' values below for both
    # the 'default' (light) and 'slate' (dark) schemes.
    - scheme: default            # Light mode
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate              # Dark mode
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs            # Top-level nav items shown as horizontal tabs
    - navigation.top             # Back-to-top button when scrolling up
    - content.code.copy          # Copy button on all code blocks
  font:
    text: Roboto
    code: Roboto Mono

# Custom CSS for professional styling (cards, images, tables)
extra_css:
  - assets/css/extra.css
  - assets/css/custom.css

markdown_extensions:
  - md_in_html                   # Allows Markdown inside HTML blocks (used for project cards)
  - attr_list                    # Allows adding CSS classes to elements: ![img](url){ .class }
  - admonition                   # Note/warning/tip boxes
  - pymdownx.details             # Collapsible admonition blocks
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:              # Renders :material-icon: and :fontawesome-brands-icon: inline icons
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: "Copyright &copy; Sardar Balbeer Singh"

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/balbeer-singh-bedi
    - icon: fontawesome/brands/github
      link: https://github.com/balbeer

plugins:
  - search
  - meta
  - mkdocs-jupyter

nav:
  - Home: index.md
  - Experience: experience.md
  - Projects:
    - Projects Overview: projects/index.md
    - Nationwide Data Warehouse: projects/nationwide-data-warehouse.md
    - CCM Realtor Prospecting Platform: projects/ccm-realtor-prospecting-platform.md   # ← ADD THIS LINE
    - Sample Notebook: projects/sample-notebook.ipynb
  - Publications: publications.md
  - Contact: contact.md